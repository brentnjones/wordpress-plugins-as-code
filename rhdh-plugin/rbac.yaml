apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhdh-create-pipelineruns
  namespace: wordpress-plugins-as-code
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhdh-create-pipelineruns
  namespace: wordpress-plugins-as-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhdh-create-pipelineruns
subjects:
  - kind: ServiceAccount
    name: default
    namespace: rhdh-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhdh-pull-plugin
  namespace: wordpress-plugins-as-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: ServiceAccount
    name: default
    namespace: rhdh-operator
