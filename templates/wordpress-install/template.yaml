apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: wordpress-install
  title: WordPress Install
  description: Create a new WordPress install using the Tekton pipeline
spec:
  owner: user:default/brentnjones
  type: service

  parameters:
    - title: Install details
      required:
        - clientName
        - targetNamespace
        - gitRevision
        - imageTag
      properties:
        clientName:
          title: Client name
          type: string
          description: Short client identifier used for install naming
          pattern: '^[a-z0-9-]+$'
        targetNamespace:
          title: Target namespace
          type: string
          description: Namespace where the install will be created
          pattern: '^[a-z0-9-]+$'
        composerPath:
          title: Composer path
          type: string
          description: Path to client-specific composer.json, or "."
          default: "."
        gitRevision:
          title: Git revision
          type: string
          description: Git branch or tag to deploy
          default: main
        imageTag:
          title: Image tag
          type: string
          description: Tag to publish and deploy
          default: latest

  steps:
    - id: create-pipeline-run
      action: openshift:pipeline-run
      input:
        namespace: wordpress-plugins-as-code
        generateName: ${{ parameters.clientName }}-
        pipelineName: wordpress-plugins-as-code
        serviceAccountName: pipeline
        registrySecretName: quay-push-secret
        consoleUrl: https://console-openshift-console.apps.xps.planenotsimple.com
        params:
          source-namespace: wordpress-plugins-as-code
          git-url: https://github.com/brentnjones/wordpress-plugins-as-code.git
          git-revision: ${{ parameters.gitRevision }}
          image-tag: ${{ parameters.imageTag }}
          install-name: ${{ parameters.clientName }}
          target-namespace: ${{ parameters.targetNamespace }}
          mysql-secret-name: mysql-credentials
          wordpress-secret-name: wordpress-db-credentials
          registry-secret-name: quay-push-secret
          db-name: wordpress
          composer-path: ${{ parameters.composerPath }}

  output:
    links:
      - title: PipelineRun in OpenShift Console
        url: ${{ steps['create-pipeline-run'].output.pipelineRunUrl }}