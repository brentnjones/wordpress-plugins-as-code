apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: wordpress-install
  title: WordPress Install
  description: Create a new WordPress install using the Tekton pipeline
spec:
  owner: user:default/brentnjones
  type: service

  parameters:
    - title: Install details
      required:
        - clientName
        - targetNamespace
        - gitRevision
        - imageTag
      properties:
        clientName:
          title: Client name
          type: string
          description: Short client identifier used for install naming
          pattern: '^[a-z0-9-]+$'
        targetNamespace:
          title: Target namespace
          type: string
          description: Namespace where the install will be created
          pattern: '^[a-z0-9-]+$'
        composerPath:
          title: Composer path
          type: string
          description: Path to client-specific composer.json, or "."
          default: "."
        gitRevision:
          title: Git revision
          type: string
          description: Git branch or tag to deploy
          default: main
        imageTag:
          title: Image tag
          type: string
          description: Tag to publish and deploy
          default: latest

  steps:
    - id: create-pipeline-run
      name: Create Tekton PipelineRun
      action: kubernetes:apply
      input:
        manifest: |
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            generateName: ${{ parameters.clientName }}-
            namespace: ${{ parameters.targetNamespace }}
          spec:
            serviceAccountName: pipeline
            pipelineRef:
              name: wordpress-plugins-as-code
            params:
              - name: source-namespace
                value: wordpress-plugins-as-code
              - name: git-url
                value: https://github.com/brentnjones/wordpress-plugins-as-code.git
              - name: git-revision
                value: ${{ parameters.gitRevision }}
              - name: image-tag
                value: ${{ parameters.imageTag }}
              - name: install-name
                value: ${{ parameters.clientName }}
              - name: target-namespace
                value: ${{ parameters.targetNamespace }}
              - name: mysql-secret-name
                value: mysql-credentials
              - name: wordpress-secret-name
                value: wordpress-db-credentials
              - name: registry-secret-name
                value: quay-push-secret
              - name: db-name
                value: wordpress
              - name: composer-path
                value: ${{ parameters.composerPath }}
            workspaces:
              - name: shared-workspace
                volumeClaimTemplate:
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 1Gi
              - name: quay-auth
                secret:
                  secretName: quay-push-secret

  output:
    links:
      - title: PipelineRun
        url: ${{ steps['create-pipeline-run'].output.entityRef }}