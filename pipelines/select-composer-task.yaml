apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: select-composer
  namespace: wordpress-plugins-as-code
spec:
  params:
    - name: composer-path
      type: string
      default: .
  workspaces:
    - name: source
  steps:
    - name: select
      image: quay.io/openshift/origin-cli:4.18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        composer_path="$(params.composer-path)"
        if [ "$composer_path" = "." ]; then
          echo "Using repository-root composer.json"
          exit 0
        fi
        if [ ! -f "$composer_path/composer.json" ]; then
          echo "No $composer_path/composer.json found; using repository-root composer.json"
          exit 0
        fi
        cp "$composer_path/composer.json" composer.json
        rm -f composer.lock
        if [ -f "$composer_path/composer.lock" ]; then
          cp "$composer_path/composer.lock" composer.lock
        fi
        echo "Using $composer_path/composer.json"