# Clones this repo, runs a SonarQube quality-gate scan, builds both custom
# images (wordpress php-fpm + nginx) with the cluster's buildah task - only
# if the quality gate passes - pushes them to quay.io/brentjon (private),
# then provisions or updates an install with the new images.
#
# Reuses the same image names/tags (wordpress-custom:latest,
# wordpress-nginx:latest), while install-specific resources are generated by
# the provisioning task.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: wordpress-plugins-as-code
  namespace: wordpress-plugins-as-code
spec:
  params:
    - name: git-url
      type: string
      default: https://github.com/brentnjones/wordpress-plugins-as-code.git
    - name: git-revision
      type: string
      default: main
    - name: image-tag
      type: string
      default: latest
    - name: install-name
      type: string
      default: wordpress
    - name: target-namespace
      type: string
      default: wordpress-plugins-as-code
    - name: mysql-secret-name
      type: string
      default: mysql-credentials
    - name: wordpress-secret-name
      type: string
      default: wordpress-db-credentials
    - name: registry-secret-name
      type: string
      default: quay-push-secret
    - name: db-name
      type: string
      default: wordpress
    - name: composer-path
      type: string
      default: .
  workspaces:
    - name: shared-workspace
    - name: quay-auth
  tasks:
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: namespace, value: openshift-pipelines }
      params:
        - { name: URL, value: $(params.git-url) }
        - { name: REVISION, value: $(params.git-revision) }
        - { name: DELETE_EXISTING, value: "true" }
      workspaces:
        - { name: output, workspace: shared-workspace }

    - name: select-composer
      runAfter: [fetch-source]
      taskRef:
        name: select-composer
      params:
        - { name: composer-path, value: $(params.composer-path) }
      workspaces:
        - { name: source, workspace: shared-workspace }

    # Quality gate: build-wordpress-image/build-nginx-image only run if this
    # passes (sonar-scanner exits non-zero on a failing SonarQube quality gate).
    - name: sonar-scan
      runAfter: [select-composer]
      taskRef:
        name: sonar-scanner
      workspaces:
        - { name: source, workspace: shared-workspace }

    - name: build-wordpress-image
      runAfter: [sonar-scan]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: namespace, value: openshift-pipelines }
      params:
        - name: IMAGE
          value: quay.io/brentjon/wordpress-custom:$(params.image-tag)
        - { name: DOCKERFILE, value: docker/wordpress/Dockerfile }
        - { name: CONTEXT, value: . }
      workspaces:
        - { name: source, workspace: shared-workspace }
        - { name: dockerconfig, workspace: quay-auth }

    - name: build-nginx-image
      runAfter: [sonar-scan]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: namespace, value: openshift-pipelines }
      params:
        - name: IMAGE
          value: quay.io/brentjon/wordpress-nginx:$(params.image-tag)
        - { name: DOCKERFILE, value: Dockerfile }
        - { name: CONTEXT, value: docker/nginx }
      workspaces:
        - { name: source, workspace: shared-workspace }
        - { name: dockerconfig, workspace: quay-auth }

    - name: rollout
      runAfter: [build-wordpress-image, build-nginx-image]
      taskRef:
        name: provision-wordpress
      params:
        - { name: target-namespace, value: $(params.target-namespace) }
        - { name: install-name, value: $(params.install-name) }
        - { name: mysql-secret-name, value: $(params.mysql-secret-name) }
        - { name: wordpress-secret-name, value: $(params.wordpress-secret-name) }
        - { name: registry-secret-name, value: $(params.registry-secret-name) }
        - { name: db-name, value: $(params.db-name) }
        - { name: image-tag, value: $(params.image-tag) }
      workspaces:
        - { name: source, workspace: shared-workspace }
