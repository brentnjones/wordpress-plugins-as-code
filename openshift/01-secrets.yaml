# Placeholders only. Do not commit real secrets.
# Create/update in-cluster instead, e.g.:
#   oc create secret generic mysql-credentials \
#     --from-literal=MYSQL_DATABASE=wordpress \
#     --from-literal=MYSQL_USER=wordpress \
#     --from-literal=MYSQL_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MYSQL_ROOT_PASSWORD="$(openssl rand -base64 24)" \
#     -n wordpress-plugins-as-code
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: wordpress-plugins-as-code
type: Opaque
stringData:
  MYSQL_DATABASE: wordpress
  MYSQL_USER: wordpress
  MYSQL_PASSWORD: CHANGE-ME
  MYSQL_ROOT_PASSWORD: CHANGE-ME-TOO
---
# WordPress secure auth keys/salts - generate real values from
# https://api.wordpress.org/secret-key/1.1/salt/ and pass via WORDPRESS_CONFIG_EXTRA
# or WORDPRESS_AUTH_KEY, WORDPRESS_SECURE_AUTH_KEY, etc. env vars.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-db-credentials
  namespace: wordpress-plugins-as-code
type: Opaque
stringData:
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: CHANGE-ME
  # Plugins/themes are managed via composer.json only, and wp-content lives on
  # an ephemeral emptyDir - block wp-admin's plugin/theme install, delete,
  # update and file-edit screens so anything installed there never silently
  # vanishes on the next rollout.
  WORDPRESS_CONFIG_EXTRA: |
    define('DISALLOW_FILE_MODS', true);
    define('DISALLOW_FILE_EDIT', true);
