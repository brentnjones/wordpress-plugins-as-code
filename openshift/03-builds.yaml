# Builds the two custom images (wordpress, nginx) from this repo's
# Dockerfiles and pushes them to quay.io/brentjon (private repos) using
# the quay-push-secret Secret. The ImageStreams below are unused - kept in
# case you want to switch back to the internal registry later.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: wordpress-custom
  namespace: wordpress-plugins-as-code
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: wordpress-custom
  namespace: wordpress-plugins-as-code
spec:
  source:
    type: Git
    git:
      uri: https://github.com/brentnjones/wordpress-plugins-as-code.git
      ref: main
    contextDir: /
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: docker/wordpress/Dockerfile
  output:
    to:
      kind: DockerImage
      name: quay.io/brentjon/wordpress-custom:latest
    pushSecret:
      name: quay-push-secret
  triggers:
    - type: ConfigChange
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: wordpress-nginx
  namespace: wordpress-plugins-as-code
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: wordpress-nginx
  namespace: wordpress-plugins-as-code
spec:
  source:
    type: Git
    git:
      uri: https://github.com/brentnjones/wordpress-plugins-as-code.git
      ref: main
    contextDir: /docker/nginx
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: DockerImage
      name: quay.io/brentjon/wordpress-nginx:latest
    pushSecret:
      name: quay-push-secret
  triggers:
    - type: ConfigChange
